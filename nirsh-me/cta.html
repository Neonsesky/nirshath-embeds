<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Inter Tight';font-weight:400 500;src:url(fonts/InterTight-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Instrument Serif';font-style:italic;src:url(fonts/InstrumentSerif-400-italic.woff2) format('woff2');font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/JetBrainsMono-400-normal.woff2) format('woff2');font-display:swap}
:root{--paper:#F2F0EB;--ink:#0C0E0D;--accent:#FF5A1F;--accent-2:#FF7A45;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0;background:transparent}
body{text-shadow:0 1px 18px rgba(0,0,0,.18);font-family:'Inter Tight',system-ui,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;padding:8px 0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,240,235,.78)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
h2{margin:20px 0 22px;font-weight:500;letter-spacing:-.045em;line-height:.95;font-size:clamp(44px,8vw,104px)}
h2 i{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.mail{display:inline-block;font-size:clamp(18px,2vw,24px);letter-spacing:-.01em;color:var(--paper);text-decoration:none;border-bottom:1px solid rgba(242,240,235,.4);padding-bottom:3px;transition:border-color .3s,color .3s}
.mail:hover{color:#fff;border-color:#fff}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 28px}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font-weight:500;font-size:16px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap;transition:transform .4s var(--ease),background .3s,color .3s}
.btn span{transition:transform .4s var(--ease)}.btn:hover span{transform:translateX(4px)}.btn:hover{transform:translateY(-2px)}
.p{background:#000;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}.p:hover{background:#fff;color:#000}
.l{color:var(--paper);box-shadow:inset 0 0 0 1px rgba(242,240,235,.55);backdrop-filter:blur(6px);background:rgba(12,14,13,.25)}.l:hover{background:var(--paper);color:var(--ink)}
.av{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,240,235,.78)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .9s var(--ease),transform .9s var(--ease)}.rv.in{opacity:1;transform:none}
@media(max-width:520px){.btn{width:100%;justify-content:space-between}h2{font-size:clamp(40px,14vw,60px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}
</style></head><body>
<div class="eyebrow rv">Get in touch</div>
<h2 class="rv">Let’s work<br><i>together.</i></h2>
<a class="mail rv" href="mailto:neonsesky@gmail.com" target="_top">neonsesky@gmail.com</a>
<div class="row rv"><a class="btn p" href="https://www.nirshath.com/multibank-mbio" target="_top">View the mb.io case study <span>→</span></a><a class="btn l" href="https://www.nirshath.com/_files/ugd/02ae95_a466c45de1cd476eaf176ac53a6424e3.pdf" target="_blank" rel="noopener">Download CV <span>↓</span></a></div>
<div class="av rv">Open to Lead Designer roles · UAE &amp; remote</div>
<script>
function go(){document.querySelectorAll('.rv').forEach(function(e,i){setTimeout(function(){e.classList.add('in')},i*90)})}
addEventListener('load',go);setTimeout(go,1200);
</script>
<script src="../lib/wheel-relay.js"></script>
</body></html>
